name: Create a ZIP file

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Build the release zip
        run: composer --working-dir src package

      - name: Upload release asset
        run: gh release upload "${{ github.event.release.tag_name }}" dist/smailyforprestashop.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
